<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>survey</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>

    <h1>Survey Form</h1>

    <form>
        <p class="subtitle">Let us know how we can improve freeCodeCamp</p>
        <div class="field">
   <label>* Name:</label>
       <input type="text" placeholder="Enter your name">
        </div>
        <div class="field">
    <label>* Email:</label>
    <input type="email" placeholder="Enter your Email">
     </div>
        <div class="field">
     <label>* Age:</label>
          <input type="number" placeholder="Age">
        </div>
        <div class="field">
      <label>Which option best describes your current role?</label>
         <select>
         <option>Student</option>
             <option>Full Time Job</option>
            </select>
        </div>
        <div class="field">
      <label>* How likely is that you would recommend freeCodeCamp to a friend?</label>
            <div class="options">
        <label><input type="radio" name="rec"> Definitely</label>
         <label><input type="radio" name="rec"> Maybe</label>
        <label><input type="radio" name="rec"> Not sure</label>
     </div>
        </div>
        <div class="field">
            <label>What do you like most in FCC:</label>
      <select>
      <option>Select an option</option>
          <option>Challenges</option>
         <option>Projects</option>
         </select>
        </div>
        <div class="field">
       <label>Things that should be improved in the future:</label>
            <div class="options">
     <label><input type="checkbox"> Front-end Projects</label>
         <label><input type="checkbox"> Back-end Projects</label>
         <label><input type="checkbox"> Data Visualization</label>
       </div>
     </div>
  </form>

</body>
</html>
